[build-system]
requires = ["setuptools>=77.0", "wheel", "numpy>=2.2", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhsmm"
version = "0.2.0"
description = "Bayesian inference in HSMMs and HMMs"
authors = [
    {name = "Matthew James Johnson", email = "mattjj@csail.mit.edu"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
]
keywords = [
    "bayesian",
    "inference",
    "mcmc",
    "time-series",
    "monte-carlo",
    "variational inference",
    "mean field",
    "vb"
]
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pybasicbayes",
    "scipy>=1.15",
]

[project.urls]
Homepage = "https://github.com/mattjj/pyhsmm"
Repository = "https://github.com/mattjj/pyhsmm.git"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0",
]

[tool.setuptools]
packages = [
    "pyhsmm",
    "pyhsmm.basic",
    "pyhsmm.internals",
    "pyhsmm.util",
]

[tool.setuptools.package-data]
pyhsmm = ["internals/*.h", "util/*.pyx"]
