[build-system]
requires = ["setuptools>=61", "wheel", "numpy>=2.2.5", "requests", "Cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhsmm"
version = "0.2.0"
description = "Bayesian inference in HSMMs and HMMs"
authors = [
    {name = "Matthew James Johnson", email = "mattjj@csail.mit.edu"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: C++"
]
keywords = [
    "bayesian",
    "inference",
    "mcmc",
    "time-series",
    "monte-carlo",
    "variational inference",
    "mean field",
    "vb"
]
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "pybasicbayes @ https://github.com/wingillis/pybasicbayes/raw/refs/heads/update-python/dist/pybasicbayes-0.3.0-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and sys_platform == 'linux'",
    "pybasicbayes @ https://github.com/wingillis/pybasicbayes/raw/refs/heads/update-python/dist/pybasicbayes-0.3.0-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux'",
    "scipy>=1.15.3",
]

[project.urls]
Homepage = "https://github.com/mattjj/pyhsmm"
Repository = "https://github.com/mattjj/pyhsmm.git"

[project.optional-dependencies]
dev = [
    "build>=1.2.2.post1",
]

[tool.setuptools]
packages = ["pyhsmm"] 
